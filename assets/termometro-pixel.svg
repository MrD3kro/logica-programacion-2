<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 20 20" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Termómetro pixel art</title>

  <!-- Contorno blanco -->
  <g fill="#ffffff">
    <rect x="4" y="1" width="4" height="1"/>
    <rect x="3" y="2" width="1" height="9"/>
    <rect x="8" y="2" width="1" height="9"/>
    <rect x="2" y="11" width="1" height="1"/>
    <rect x="9" y="11" width="1" height="1"/>
    <rect x="1" y="12" width="1" height="3"/>
    <rect x="10" y="12" width="1" height="3"/>
    <rect x="2" y="15" width="1" height="1"/>
    <rect x="9" y="15" width="1" height="1"/>
    <rect x="3" y="16" width="1" height="1"/>
    <rect x="8" y="16" width="1" height="1"/>
    <rect x="4" y="17" width="4" height="1"/>
  </g>

  <!-- Contorno oscuro interior -->
  <g fill="#1c1c24">
    <rect x="4" y="2" width="4" height="1"/>
    <rect x="4" y="3" width="1" height="8"/>
    <rect x="7" y="3" width="1" height="8"/>
    <rect x="3" y="11" width="1" height="1"/>
    <rect x="8" y="11" width="1" height="1"/>
    <rect x="2" y="12" width="1" height="3"/>
    <rect x="9" y="12" width="1" height="3"/>
    <rect x="3" y="15" width="1" height="1"/>
    <rect x="8" y="15" width="1" height="1"/>
    <rect x="4" y="16" width="4" height="1"/>
  </g>

  <!-- Parte azul (frío / vacío del tubo) -->
  <rect x="5" y="3" width="1" height="4" fill="#a9c1f5"/>
  <rect x="6" y="3" width="1" height="4" fill="#6f8fe8"/>

  <!-- Mercurio rojo -->
  <g fill="#b83232">
    <rect x="5" y="7" width="2" height="4"/>
    <rect x="4" y="11" width="4" height="1"/>
    <rect x="3" y="12" width="6" height="3"/>
    <rect x="4" y="15" width="4" height="1"/>
  </g>

  <!-- Sombras del rojo -->
  <g fill="#8c1c1c">
    <rect x="6" y="7" width="1" height="4"/>
    <rect x="7" y="11" width="1" height="1"/>
    <rect x="8" y="12" width="1" height="3"/>
    <rect x="7" y="14" width="1" height="2"/>
  </g>

  <!-- Brillos del bulbo -->
  <rect x="4" y="12" width="2" height="2" fill="#d96b6b"/>
  <rect x="4" y="12" width="1" height="1" fill="#f2a5a5"/>

  <!-- Símbolo °C -->
  <g fill="#ffffff">
    <rect x="12" y="3" width="2" height="2"/>
    <rect x="15" y="3" width="3" height="1"/>
    <rect x="15" y="4" width="1" height="3"/>
    <rect x="15" y="7" width="3" height="1"/>
  </g>
</svg>
